<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline</title>
  <style>
    :root {
      --bg: #fafbfc;
      --ink: #111827;
      --mute: #6b7280;
      --line: #e5e7eb;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, Segoe UI, sans-serif; }
    .page { max-width: 640px; margin: 0 auto; padding: 10vh 20px 80px; }
    h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 650; letter-spacing: -.03em; line-height: 1.25; margin: 0 0 10px; text-align: center; }
    .brand { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--blue); margin: 0 0 16px; }
    .slogan { text-align: center; color: var(--mute); margin: 0 0 28px; font-size: 15px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .choice {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .choice:hover, .choice.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    label { display: block; font-size: 13px; color: var(--mute); margin: 12px 0 6px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid rgba(37,99,235,.35); border-color: var(--blue); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0;
      font: 600 15px/1 inherit; cursor: pointer;
    }
    .btn.primary { background: var(--blue); color: #fff; width: 100%; margin-top: 18px; }
    .btn.primary:hover { background: var(--blue-hover); }
    .btn.primary:disabled { opacity: .5; cursor: default; }
    .btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); width: 100%; margin-top: 12px; }
    .err { color: #b91c1c; font-size: 14px; text-align: center; min-height: 20px; margin-top: 10px; }
    .hidden { display: none !important; }
    .stage { text-align: center; color: var(--mute); margin: 24px 0; }
    .cards { display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 0 0 8px; font-weight: 700; }
    .card p { margin: 0; }
    .card ul { margin: 0; padding-left: 18px; }
    .card li { margin: 6px 0; }
    .peer { display: block; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
    .peer:first-child { border-top: 0; }
    .peer b { color: var(--blue); }
    .peer span { display: block; color: var(--mute); font-size: 13px; margin-top: 4px; }
    .lock {
      position: fixed; left: 14px; bottom: 14px; width: 36px; height: 36px;
      border-radius: 10px; border: 1px solid var(--line); background: #fff;
      cursor: pointer; color: var(--mute); font-size: 16px;
    }
    .note { text-align: center; color: var(--mute); font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="page">
    <form id="form">
      <p class="brand">Northline</p>
      <h1>Manual work is quietly ruining the company</h1>
      <p class="slogan">Show us the website, the socials, a file, or describe the process.</p>
      <div class="choices">
        <button type="button" class="choice on" data-source="website">Website</button>
        <button type="button" class="choice" data-source="social">Social media</button>
        <button type="button" class="choice" data-source="csv">Data file / CSV</button>
        <button type="button" class="choice" data-source="describe">Describe how you work</button>
      </div>
      <div id="urlWrap">
        <label id="urlLabel" for="url">Website</label>
        <input id="url" type="url" placeholder="https://" />
      </div>
      <div id="fileWrap" class="hidden">
        <label for="file">CSV or export</label>
        <input id="file" type="file" accept=".csv,text/csv,text/plain" />
      </div>
      <div id="descWrap" class="hidden">
        <label for="description">How work moves today</label>
        <textarea id="description" placeholder="Who takes the lead, where it lives (WhatsApp, Excel, inbox), what you do by hand…"></textarea>
      </div>
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" required />
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />
      <button class="btn primary" id="searchBtn" type="submit">Search</button>
      <p class="err" id="err"></p>
    </form>

    <div id="live" class="hidden">
      <p class="stage" id="stage">Looking at how you work. This usually takes under a minute…</p>
      <div id="results" class="cards hidden"></div>
      <button class="btn primary hidden" id="emailBtn" type="button">Email me the full report</button>
      <button class="btn ghost hidden" id="downloadBtn" type="button">Download the full report</button>
      <button class="btn ghost hidden" id="betterBtn" type="button">See similar companies doing it right</button>
      <div id="peers" class="card hidden" style="margin-top:16px"></div>
      <p class="note" id="note"></p>
    </div>
  </div>
  <button class="lock" type="button" title="Admin" onclick="openAdmin()">🔒</button>
<script>
let source = "website";
let runId = null;
let poll = null;
document.querySelectorAll(".choice").forEach(btn => {
  btn.onclick = () => {
    source = btn.dataset.source;
    document.querySelectorAll(".choice").forEach(b => b.classList.toggle("on", b===btn));
    document.getElementById("urlWrap").classList.toggle("hidden", source==="csv" || source==="describe");
    document.getElementById("fileWrap").classList.toggle("hidden", source!=="csv");
    document.getElementById("descWrap").classList.toggle("hidden", source!=="describe" && source!=="csv");
    document.getElementById("urlLabel").textContent = source==="social" ? "Social profile link" : "Website";
  };
});
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const fd = new FormData();
  fd.append("name", document.getElementById("name").value.trim());
  fd.append("email", document.getElementById("email").value.trim());
  fd.append("source", source);
  fd.append("url", document.getElementById("url").value.trim());
  fd.append("description", document.getElementById("description").value.trim());
  const file = document.getElementById("file").files[0];
  if (file) fd.append("file", file);
  document.getElementById("searchBtn").disabled = true;
  try {
    const r = await fetch("/api/search", {method:"POST", body: fd});
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(typeof data.detail==="string" ? data.detail : "Could not start");
    runId = data.id;
    document.getElementById("form").classList.add("hidden");
    document.getElementById("live").classList.remove("hidden");
    document.getElementById("stage").textContent = "Looking at how you work. This usually takes under a minute…";
    watch();
  } catch (ex) {
    err.textContent = ex.message;
    document.getElementById("searchBtn").disabled = false;
  }
};
function watch(){
  if (poll) clearInterval(poll);
  const tick = async () => {
    const r = await fetch("/api/runs/"+runId);
    if (!r.ok) return;
    const d = await r.json();
    if (d.status==="completed") {
      document.getElementById("stage").textContent = "Your snapshot";
    } else {
      const p = d.progress || "Looking at how you work.";
      document.getElementById("stage").textContent = p.toLowerCase().includes("minute") ? p : (p + " This usually takes under a minute…");
    }
    if (d.result && d.status==="completed") {
      renderResult(d.result);
      clearInterval(poll);
    }
    if (d.status==="failed") {
      document.getElementById("stage").textContent = "Could not finish";
      document.getElementById("note").textContent = d.error || "Try another option.";
      clearInterval(poll);
    }
  };
  tick();
  poll = setInterval(tick, 1500);
}
function renderResult(res){
  const facts = (res.facts||[]).filter(Boolean);
  const gaps = (res.gaps||[]).filter(Boolean);
  const ch = res.channel || {};
  const missing = (ch.missing||[]).filter(Boolean);
  const explore = (ch.explore||[]).filter(Boolean);
  const src = res.source || source;
  const commentTitle = {
    website: "Comment on your website",
    social: "Comment on this profile",
    csv: "Comment on this file",
    describe: "Comment on how you work"
  }[src] || "Comment on what you sent";
  const extraTitle = src === "social" ? "Other apps and extra suggestions" : "Extra suggestions";
  document.getElementById("results").classList.remove("hidden");
  document.getElementById("results").innerHTML = `
    <div class="card"><h2>What looks manual</h2><p>${esc(res.observed || "We could not see a clear public process yet.")}</p></div>
    <div class="card"><h2>${esc(commentTitle)}</h2><p>${esc(ch.state || "We read what you sent and mapped the process we could see.")}</p>
      ${missing.length ? "<p style='margin-top:10px'><b>What’s missing</b></p><ul>"+missing.map(g=>"<li>"+esc(g)+"</li>").join("")+"</ul>" : ""}
      ${explore.length ? "<p style='margin-top:10px'><b>"+esc(extraTitle)+"</b></p><ul>"+explore.map(g=>"<li>"+esc(g)+"</li>").join("")+"</ul>" : ""}</div>
    <div class="card"><h2>Where time is leaking</h2>${gaps.length ? "<ul>"+gaps.map(g=>"<li>"+esc(g)+"</li>").join("")+"</ul>" : "<p>No strong public gap — the report still captures what we saw.</p>"}</div>
    <div class="card"><h2>What we would automate first</h2><p>${esc(res.offer || "The hand-offs that still wait on a person.")}</p>
      ${facts.length ? "<ul>"+facts.map(f=>"<li>"+esc(f)+"</li>").join("")+"</ul>" : ""}</div>`;
  document.getElementById("emailBtn").classList.remove("hidden");
  document.getElementById("emailBtn").onclick = emailReport;
  document.getElementById("downloadBtn").classList.remove("hidden");
  document.getElementById("downloadBtn").onclick = downloadReport;
  document.getElementById("betterBtn").classList.remove("hidden");
  document.getElementById("betterBtn").onclick = findBetter;
}
async function emailReport(){
  const btn = document.getElementById("emailBtn");
  btn.disabled = true;
  document.getElementById("note").textContent = "";
  try {
    const r = await fetch("/api/runs/"+runId+"/email", {method:"POST"});
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(typeof data.detail==="string" ? data.detail : "Could not send yet");
    document.getElementById("note").textContent = "Sent. Check your inbox.";
  } catch (ex) {
    document.getElementById("note").textContent = ex.message + " Download the full report below if email is not working.";
    btn.disabled = false;
  }
}
function downloadReport(){
  window.location.href = "/api/runs/"+runId+"/report";
}
async function findBetter(){
  const btn = document.getElementById("betterBtn");
  btn.disabled = true;
  document.getElementById("stage").textContent = "Finding companies doing better…";
  await fetch("/api/runs/"+runId+"/better", {method:"POST"});
  const started = Date.now();
  const t = setInterval(async () => {
    const r = await fetch("/api/runs/"+runId);
    const d = await r.json();
    const peers = (d.result && d.result.doing_it_right) || [];
    if (peers.length || Date.now()-started > 45000) {
      clearInterval(t);
      document.getElementById("stage").textContent = "Companies doing better";
      showPeers(peers);
      btn.disabled = false;
      if (peers.length) {
        document.getElementById("note").textContent = "These companies are now in the full report. Download or email it again to keep them.";
      }
    }
  }, 1500);
}
function showPeers(peers){
  const box = document.getElementById("peers");
  box.classList.remove("hidden");
  if (!peers.length) { box.innerHTML = "<h2>Companies doing better</h2><p>None turned up on this pass. Try again in a moment.</p>"; return; }
  box.innerHTML = "<h2>Companies like you, further along</h2>" + peers.map(p =>
    `<a class="peer" href="${esc(p.website)}" target="_blank" rel="noopener"><b>${esc(p.name)}</b><span>${esc(p.snippet||"")}</span></a>`
  ).join("");
}
async function openAdmin(){
  const pin = prompt("Admin pin");
  if (!pin) return;
  const r = await fetch("/api/admin/unlock", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin})});
  if (!r.ok) { alert("Wrong pin"); return; }
  sessionStorage.setItem("adminPin", pin);
  location.href = "/admin";
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
</script>
</body>
</html>
