<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline admin</title>
  <style>
    body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #94a3b8; }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 18px; font: 600 14px inherit; cursor: pointer;
    }
    button:disabled { opacity: .5; }
    table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #1e293b; vertical-align: top; }
    th { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
    a { color: #93c5fd; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin hunt</h1>
    <p>Find companies with serious automation problems and email public decision-makers we can actually verify.</p>
    <button id="go" type="button">Search companies with automation problems</button>
    <p class="err" id="err"></p>
    <div id="meta"></div>
    <table><thead><tr><th>Score</th><th>Company</th><th>Gap</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
<script>
const pin = sessionStorage.getItem("adminPin") || "";
if (!pin) location.href = "/";
let current = null;
let poll = null;
document.getElementById("go").onclick = async () => {
  document.getElementById("err").textContent = "";
  document.getElementById("go").disabled = true;
  try {
    const r = await fetch("/api/runs", {
      method: "POST",
      headers: {"Content-Type":"application/json", "X-Admin-Pin": pin},
      body: JSON.stringify({icp: ""})
    });
    const d = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(typeof d.detail==="string" ? d.detail : "Could not start");
    current = d.id;
    watch();
  } catch (e) {
    document.getElementById("err").textContent = e.message;
    document.getElementById("go").disabled = false;
  }
};
function watch(){
  if (poll) clearInterval(poll);
  const tick = async () => {
    const r = await fetch("/api/runs/"+current);
    const d = await r.json();
    document.getElementById("meta").textContent = `Hunt ${d.id} · ${d.status} · ${d.discovered_count} found · ${d.qualified_count} qualified`;
    document.getElementById("rows").innerHTML = (d.companies||[]).map(c =>
      `<tr><td>${c.lead_score??"—"}</td><td><b>${esc(c.name)}</b><br><a href="${esc(c.website)}" target="_blank">${esc(c.website)}</a></td><td>${esc((c.observed_problem||"").slice(0,160))}</td><td>${esc(c.status)}</td></tr>`
    ).join("");
    if (["completed","failed"].includes(d.status)) {
      clearInterval(poll);
      document.getElementById("go").disabled = false;
    }
  };
  tick();
  poll = setInterval(tick, 3000);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
</script>
</body>
</html>
