services:
  - type: web
    name: northline
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOOKING_URL
        value: https://calendly.com/lucianamitchell19/northline-business-automation
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: EMAIL_SENDING_ENABLED
        value: "false"
      - key: OUTBOUND_SEND_ENABLED
        value: "false"
